    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>

    <style>
      /* Paint the ground before React mounts so there is no flash. The two
         values have to match the --ink-1 / --text tokens in signal.css. */
      html { background: #0d1014; }
      body { margin: 0; background: #0d1014; color: #e2e8f1; }
      html[data-theme="light"],
      html[data-theme="light"] body { background: #f6f7f3; color: #141a17; }
    </style>
    <script>
      /* Resolve the theme before first paint: a stored choice wins, otherwise
         follow the OS. Running here rather than in React is what stops the
         page flashing the wrong ground while the bundle loads. */
      (function () {
        try {
          var stored = localStorage.getItem("sg-theme");
          var light =
            stored === "light" ||
            (!stored &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches);
          if (light) {
            document.documentElement.setAttribute("data-theme", "light");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#f6f7f3");
          }
        } catch (e) {}
      })();
    </script>
